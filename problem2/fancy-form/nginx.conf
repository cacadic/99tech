server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Static demo: no cookies, no secrets. The only third-party request is the public price feed.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://interview.switcheo.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # NOTE: do not use `add_header` inside the locations below. nginx only inherits the server-level add_header
  # lines (the security headers above) into a location that defines none of its own, so a Cache-Control
  # add_header there would silently drop the CSP, nosniff and Referrer-Policy from every real response.
  # `expires` sets Cache-Control without that side effect.

  # Fingerprinted build output never changes under the same name.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # Single-page app: unknown paths fall back to index.html, which must always be revalidated.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
